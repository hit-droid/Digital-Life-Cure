name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup signing keystore
        run: |
          if [ ! -f app/release-key.p12 ]; then
            keytool -genkeypair -v \
              -keystore app/release-key.p12 \
              -storepass android -keypass android \
              -alias maidenkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Digital Life, OU=App, O=DigitalLife, C=CN"
          fi

      - name: Cache signing keystore
        uses: actions/cache@v4
        with:
          path: app/release-key.p12
          key: digital-life-signing-p12-stable

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Create GitHub Release and upload APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          echo "APK=$APK_PATH"
          RELEASE_RESPONSE=$(curl -sS -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d "{\"tag_name\":\"v1.20.0\",\"name\":\"数字生命 v1.20.0\",\"body\":\"修复 5 个 bug 并新增记忆管理功能（设置页查看/编辑/删除/导出/导入长期记忆）。CI 签名改为 actions/cache 持久化 p12。\",\"target_commitish\":\"${{ github.sha }}\"}")
          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id // empty')
          if [ -z "$RELEASE_ID" ]; then
            echo "Release v1.20.0 already exists, fetching its id"
            RELEASE_ID=$(curl -sS \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/releases/tags/v1.20.0 | jq -r '.id // empty')
          fi
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Failed to resolve release id"
            echo "$RELEASE_RESPONSE"
            exit 1
          fi
          curl -sS -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$(basename "$APK_PATH")" \
            --data-binary @"$APK_PATH"
