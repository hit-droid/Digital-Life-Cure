name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        # runner 自带 Android SDK；只补装缺失组件，避免依赖第三方 action
        run: |
          set -e
          if [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          else
            SDK="$ANDROID_HOME"
          fi
          echo "SDK=$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools" \
            >/dev/null 2>&1 || true
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Setup signing keystore
        run: |
          if [ ! -f app/release-key.p12 ]; then
            keytool -genkeypair -v \
              -keystore app/release-key.p12 \
              -storepass android -keypass android \
              -alias maidenkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Digital Life, OU=App, O=DigitalLife, C=CN"
          fi

      - name: Cache signing keystore
        uses: actions/cache@v4
        with:
          path: app/release-key.p12
          key: digital-life-signing-p12-stable

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Robolectric android-all jars
        # Robolectric 首次运行要下载 android-all jar（约十几分钟），缓存避免每次 CI 重下
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-${{ runner.os }}

      - name: Run unit tests
        # 单测门禁：失败则不再出包、不发 Release，防止半成品混进发行版
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Create GitHub Release and upload APK
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          echo "APK=$APK_PATH"
          VERSION_NAME=$(grep -oE 'versionName\s+"[^"]+"' app/build.gradle | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION_NAME" ]; then
            echo "Failed to read versionName from app/build.gradle"
            exit 1
          fi
          TAG="v${VERSION_NAME}"
          echo "TAG=$TAG"
          RELEASE_RESPONSE=$(curl -sS -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"数字生命 ${TAG}\",\"body\":\"自动发布：基于当前构建 versionName=${VERSION_NAME}。请查看 CHANGELOG.md 了解本次变更。\",\"target_commitish\":\"${{ github.sha }}\"}")
          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id // empty')
          if [ -z "$RELEASE_ID" ]; then
            echo "Release ${TAG} already exists, fetching its id"
            RELEASE_ID=$(curl -sS \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG} | jq -r '.id // empty')
          fi
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Failed to resolve release id for ${TAG}"
            echo "$RELEASE_RESPONSE"
            exit 1
          fi
          APK_NAME=$(basename "$APK_PATH")
          # 若 release 下已有同名 asset，先删除再上传，避免 422 already_exists
          EXISTING_ASSET_ID=$(curl -sS \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
            | jq -r --arg n "$APK_NAME" '.[] | select(.name==$n) | .id' | head -n1)
          if [ -n "$EXISTING_ASSET_ID" ] && [ "$EXISTING_ASSET_ID" != "null" ]; then
            echo "Deleting existing asset ${APK_NAME} (id=${EXISTING_ASSET_ID})"
            curl -sS -X DELETE \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/${EXISTING_ASSET_ID}"
          fi
          curl -sS -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=${APK_NAME}" \
            --data-binary @"$APK_PATH"
          echo "Uploaded ${APK_NAME} to release ${TAG}"
