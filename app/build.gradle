plugins {
    id 'com.android.application'
}

android {
    namespace 'com.digitallife'
    compileSdk 34

    defaultConfig {
        applicationId "com.digitallife"
        minSdk 21
        targetSdk 34
        versionCode 151
        versionName "1.148.0"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                // Android 15+ 的 16 KB 页设备（Android 16 默认）无法加载按 4 KB 对齐的 .so。
                // NDK r27 起 c++_shared 已是 16 KB 对齐；此处仍在用 r26，故改用 c++_static，
                // 不再打包 NDK 预编译的 4 KB 对齐 libc++_shared.so（详见 CMakeLists.txt 的对齐链接项）。
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    signingConfigs {
        // 本地/CI 均用 app/release-key.p12（库文件被 .gitignore 忽略，CI 首次运行自动生成并缓存）。
        // 密码默认值与 CI 生成参数一致，可用环境变量覆盖以接入自有密钥（不用改代码）。
        debug {
            storeFile file("release-key.p12")
            storePassword "android"
            keyAlias "maidenkey"
            keyPassword "android"
            storeType "PKCS12"
        }
        release {
            storeFile file(System.getenv("RELEASE_STORE_FILE") ?: "release-key.p12")
            storePassword System.getenv("RELEASE_STORE_PASSWORD") ?: "android"
            keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: "maidenkey"
            keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: "android"
            storeType "PKCS12"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        // v1.143.0：发行包改用 release 构建——非 debuggable（不可 attach 调试器 / run-as 取数据），
        // 且与历史包同密钥签名（同 p12/alias），老用户可直接覆盖升级。
        // R8 暂不开：native 侧用 FindClass/GetStaticMethodID 按名回调 Live2DNative.loadFile，
        // 另有 Tools.register 的反射调用，开启混淆须配 keep 规则并做真机冒烟，本环境无设备验证，
        // 故 minifyEnabled 保持 false；待有设备验证后再开（规则见 CHANGELOG v1.143.0）。
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    aaptOptions {
        // Keep the optional 4096px source textures out of the runtime APK.
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!huohuo.4096'
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

// Robolectric 首次运行要从 Maven 下载 android-all jar，而测试 worker 是独立 JVM，
// 不继承 shell 里的 HTTP_PROXY/HTTPS_PROXY，导致有代理的环境下也拉不到包。
// 这里把代理环境变量转成测试 JVM 的系统属性（代理地址不写死在脚本里）；无代理时空操作。
tasks.withType(Test).configureEach {
    def rawProxy = System.getenv('HTTPS_PROXY') ?: System.getenv('https_proxy')
            ?: System.getenv('HTTP_PROXY') ?: System.getenv('http_proxy')
    if (rawProxy) {
        try {
            def uri = new java.net.URI(rawProxy)
            if (uri.host != null) {
                systemProperty 'https.proxyHost', uri.host
                systemProperty 'http.proxyHost', uri.host
                systemProperty 'https.proxyPort', String.valueOf(uri.port)
                systemProperty 'http.proxyPort', String.valueOf(uri.port)
            }
        } catch (Exception ignored) {
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.test:core:1.5.0'
}
