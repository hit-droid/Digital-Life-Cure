plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maiden.dungeon'
    compileSdk 34

    defaultConfig {
        applicationId "com.maiden.dungeon"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.7"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file("release-key.p12")
            storePassword "android"
            keyAlias "maidenkey"
            keyPassword "android"
            storeType "PKCS12"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

dependencies {
}
